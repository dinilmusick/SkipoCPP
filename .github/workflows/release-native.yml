name: Verified native source release
on:
  workflow_run:
    workflows: ["SkipoCPP pinned native build and external consumer"]
    types: [completed]
permissions:
  contents: read
jobs:
  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact successful CI SHA of current main
        env:
          VERIFIED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD"
      - name: Verify version file exists
        run: test -s version.txt
      - name: Prepare semantic version or issue GitHub source release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
